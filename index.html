<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OffDutyCode</title>
  <meta name="description" content="OffDutyCode — code written after hours.">
  <style>
    :root { --bg: #0f1115; --fg: #e8e8e8; --muted: #9aa0a6; --accent: #7cd992; }
    @media (prefers-color-scheme: light) {
      :root { --bg: #fafafa; --fg: #1a1a1a; --muted: #5f6368; --accent: #1e8e3e; }
    }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg);
      font-family: ui-monospace, "SF Mono", Consolas, monospace;
      padding: 16px;
    }
    main { max-width: 560px; }
    h1 { font-size: clamp(2rem, 8vw, 3.5rem); letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { margin-top: 1rem; color: var(--muted); line-height: 1.6; }
    .cursor { display: inline-block; width: 0.6em; background: var(--accent); animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    footer { margin-top: 2.5rem; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>off<span>duty</span>code<span class="cursor">&nbsp;</span></h1>
    <p>Code written after hours. Something is being built here — check back soon.</p>
    <footer>&copy; 2026 offdutycode.com</footer>
  </main>
</body>
</html>
