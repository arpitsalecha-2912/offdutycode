<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Office Focus Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0b12; --fg: #eef0f7; --muted: #9097ab; --work: #9d8cff; --rest: #ffb86b; --ring: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 50% 0%, #1d1840 0%, var(--bg) 60%); color: var(--fg);
      font-family: "Space Grotesk", system-ui, sans-serif; text-align: center;
    }
    body.rest { background: radial-gradient(circle at 50% 0%, #33220f 0%, var(--bg) 60%); }
    main { width: 100%; max-width: 420px; }
    h1 { font-size: 1rem; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .presets { display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; border: 1px solid var(--ring); background: rgba(255,255,255,0.04); margin-top: 14px; }
    .presets button { border: 0; background: transparent; color: var(--muted); padding: 8px 12px; border-radius: 9px; font: 600 0.85rem "Space Grotesk", sans-serif; cursor: pointer; }
    .presets button.on { background: rgba(255,255,255,0.1); color: var(--fg); }
    .dial { position: relative; width: min(74vw, 290px); aspect-ratio: 1; margin: 24px auto; }
    svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    circle { fill: none; stroke-width: 10; }
    .track { stroke: var(--ring); }
    .prog { stroke: var(--work); stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
    body.rest .prog { stroke: var(--rest); }
    .time { position: absolute; inset: 0; display: grid; place-content: center; font-family: "JetBrains Mono", monospace; }
    .time b { font-size: clamp(2.6rem, 12vw, 3.6rem); }
    .time span { color: var(--muted); font-size: 0.88rem; font-family: "Space Grotesk", sans-serif; padding: 0 24px; }
    .task { width: 100%; font: 1rem "Space Grotesk", sans-serif; color: var(--fg); background: rgba(0,0,0,0.3); border: 1px solid var(--ring); border-radius: 12px; padding: 12px 14px; margin-bottom: 14px; text-align: center; outline: 0; }
    .task:focus { border-color: var(--work); }
    .btns { display: flex; gap: 12px; justify-content: center; }
    button.act {
      font: 600 1rem "Space Grotesk", sans-serif; padding: 14px 26px; border-radius: 14px; cursor: pointer;
      border: 1px solid var(--ring); background: rgba(255,255,255,0.05); color: var(--fg);
    }
    button.main { background: var(--work); border-color: var(--work); color: #140b3a; min-width: 130px; }
    body.rest button.main { background: var(--rest); border-color: var(--rest); color: #2e1a05; }
    .count { margin-top: 22px; color: var(--muted); font-size: 0.9rem; }
    .log { list-style: none; margin-top: 10px; display: grid; gap: 6px; font-size: 0.85rem; color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1 id="mode">💻 Deep work</h1>
    <div class="presets" id="presets">
      <button data-w="25" data-r="5" class="on">25 / 5</button>
      <button data-w="50" data-r="10">50 / 10</button>
      <button data-w="90" data-r="15">90 / 15</button>
    </div>
    <div class="dial">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="prog" id="prog" cx="60" cy="60" r="52"/></svg>
      <div class="time"><b id="time">25:00</b><span id="hint">Slack on mute. Let's go.</span></div>
    </div>
    <input class="task" id="task" maxlength="60" placeholder="What are you working on? (e.g. JIRA-142)">
    <div class="btns">
      <button class="act main" id="start">Start</button>
      <button class="act" id="reset">Reset</button>
    </div>
    <p class="count" id="count">✅ 0 focus sessions today</p>
    <ul class="log" id="log"></ul>
  </main>
  <script>
    let LEN = { focus: 25 * 60, rest: 5 * 60 };
    const C = 2 * Math.PI * 52;
    const prog = document.getElementById("prog");
    prog.style.strokeDasharray = C;
    let mode = "focus", left = LEN.focus, timer = null, done = 0;
    const breakIdeas = ["Chai break with the team ☕", "Walk to the water cooler 💧", "Stretch, you've earned it 🙆", "Check on your desk buddy 👋", "Snack run to the pantry 🍪"];
    const focusIdeas = ["Slack on mute. Let's go.", "Headphones on, notifications off 🎧", "One ticket at a time.", "Pretend there are no meetings."];
    const pick = a => a[Math.floor(Math.random() * a.length)];

    function draw() {
      const m = String(Math.floor(left / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0");
      document.getElementById("time").textContent = `${m}:${s}`;
      document.title = `${m}:${s} · ${mode === "focus" ? "Deep work" : "Break"}`;
      prog.style.strokeDashoffset = C * (1 - left / LEN[mode]);
      document.getElementById("mode").textContent = mode === "focus" ? "💻 Deep work" : "☕ Break time";
      document.body.classList.toggle("rest", mode === "rest");
    }
    function tick() {
      if (--left > 0) return draw();
      if (mode === "focus") {
        done++;
        const task = document.getElementById("task").value.trim() || "Focus session";
        const li = document.createElement("li");
        li.textContent = `✔ ${task} · ${new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })}`;
        document.getElementById("log").prepend(li);
      }
      mode = mode === "focus" ? "rest" : "focus";
      left = LEN[mode];
      document.getElementById("count").textContent = `✅ ${done} focus session${done === 1 ? "" : "s"} today`;
      document.getElementById("hint").textContent = mode === "focus" ? pick(focusIdeas) : pick(breakIdeas);
      draw();
    }
    function stop() { clearInterval(timer); timer = null; document.getElementById("start").textContent = "Start"; }
    document.getElementById("start").onclick = () => {
      if (timer) { stop(); document.getElementById("hint").textContent = "Paused. Someone stopped by your desk?"; }
      else { timer = setInterval(tick, 1000); document.getElementById("start").textContent = "Pause"; document.getElementById("hint").textContent = mode === "focus" ? pick(focusIdeas) : pick(breakIdeas); }
    };
    function reset() { stop(); mode = "focus"; left = LEN.focus; document.getElementById("hint").textContent = "Slack on mute. Let's go."; draw(); }
    document.getElementById("reset").onclick = reset;
    document.getElementById("presets").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      document.querySelectorAll("#presets button").forEach(x => x.classList.toggle("on", x === b));
      LEN = { focus: +b.dataset.w * 60, rest: +b.dataset.r * 60 };
      reset();
    });
    draw();
  </script>
</body>
</html>
