<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Lunch Splitter</title>
  <script src="../_shared/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_shared/ui.css">
  <style>
    :root { --accent: var(--green); --accent-fg: #052e1c; }
    .layout { display: grid; gap: 16px; }
    @media (min-width: 900px) {
      .layout { grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: start; }
      .result { position: sticky; top: 24px; }
    }
    .grid2 { display: grid; grid-template-columns: 1fr; gap: 14px; }
    @media (min-width: 560px) { .grid2 { grid-template-columns: 1fr 1fr; } }
    .amount { display: grid; grid-template-columns: 96px 1fr; gap: 8px; }
    select.input { appearance: none; text-align: center; font-weight: 600; }
    #bill { font-family: var(--mono); font-size: 1.25rem; font-weight: 500; }
    .tips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .tips button { padding: 12px 0; border-radius: 13px; border: 1px solid var(--line); background: var(--inset); font-weight: 600; transition: all .15s; }
    .tips button:hover { border-color: var(--line-2); }
    .tips button.on { background: var(--green); border-color: transparent; color: #06210f; }
    .presets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .presets button { font-size: 0.82rem; padding: 6px 11px; border-radius: 99px; border: 1px solid var(--line); background: var(--inset); color: var(--muted); }
    .presets button:hover { color: var(--fg); border-color: var(--line-2); }

    .add { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .people { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .person { display: inline-flex; align-items: center; gap: 8px; padding: 5px 6px 5px 6px; border-radius: 99px; background: var(--inset); border: 1px solid var(--line); font-size: 0.92rem; cursor: pointer; transition: border-color .15s; }
    .person:hover { border-color: var(--line-2); }
    .person .av { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.75rem; font-weight: 700; color: #0b0920; }
    .person.payer { border-color: rgba(124,217,146,0.6); background: rgba(124,217,146,0.1); }
    .person .x { border: 0; background: transparent; color: var(--dim); width: 22px; height: 22px; border-radius: 50%; font-size: 0.8rem; }
    .person .x:hover { color: var(--fg); background: var(--panel-2); }
    .paid { font-size: 0.7rem; font-weight: 600; color: var(--green); }
    .hint { color: var(--dim); font-size: 0.82rem; margin-top: 12px; }

    .result { overflow: hidden; }
    .each span { color: var(--muted); font-size: 0.88rem; }
    .each b { display: block; font-family: var(--display); font-size: clamp(2.6rem, 8vw, 3.4rem); font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; color: var(--green); }
    .totals { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0; }
    .totals div { padding: 12px 14px; border-radius: 14px; background: var(--inset); border: 1px solid var(--line); }
    .totals span { display: block; color: var(--muted); font-size: 0.78rem; }
    .totals b { font-family: var(--mono); font-size: 1.05rem; }
    .owes { list-style: none; display: grid; gap: 8px; margin-bottom: 16px; }
    .owes li { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-radius: 14px; background: var(--inset); border: 1px solid var(--line); font-size: 0.92rem; }
    .owes li .arrow { color: var(--dim); }
    .owes li b { margin-left: auto; font-family: var(--mono); }
    .toast { text-align: center; color: var(--green); font-size: 0.85rem; min-height: 1.3em; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <p class="eyebrow">Office lunch · Friday treats</p>
        <h1 class="title">🍱 Team Lunch Splitter</h1>
        <p class="lead">Split the bill with colleagues and friends, then share who owes what.</p>
      </div>
    </header>

    <div class="layout">
      <div class="stack">
        <section class="card">
          <div class="card-title">The bill</div>
          <div class="grid2">
            <label><span class="label">What's it for?</span><input class="input" id="what" maxlength="40" value="Team lunch"></label>
            <div>
              <span class="label">Amount</span>
              <div class="amount">
                <select class="input" id="cur" aria-label="Currency"><option>₹</option><option>$</option><option>€</option><option>£</option><option>AED</option></select>
                <input class="input" id="bill" type="number" inputmode="decimal" min="0" step="0.01" value="1800" aria-label="Bill amount">
              </div>
            </div>
          </div>
          <div class="presets" id="whatPresets">
            <button type="button">🍛 Team lunch</button><button type="button">🎂 Birthday cake</button><button type="button">🍕 Friday pizza</button><button type="button">☕ Chai &amp; snacks</button><button type="button">🎉 Farewell party</button>
          </div>
          <span class="label" style="margin-top:18px">Tip</span>
          <div class="tips" id="tips"></div>
        </section>

        <section class="card">
          <div class="card-title">Who's in? <small id="headcount"></small></div>
          <form class="add" id="addForm" autocomplete="off">
            <input class="input" id="name" maxlength="20" placeholder="Add a friend or colleague">
            <button class="btn" type="submit">Add</button>
          </form>
          <div class="people" id="people"></div>
          <p class="hint">Tap a name to mark who paid. Names are saved on this device.</p>
        </section>
      </div>

      <section class="card result">
        <div class="each"><span>Each person pays</span><b id="each">0</b></div>
        <div class="totals">
          <div><span>Tip</span><b id="tip">0</b></div>
          <div><span>Grand total</span><b id="total">0</b></div>
        </div>
        <ul class="owes" id="owes"></ul>
        <button class="btn primary block" id="share">Share with the group 📲</button>
        <p class="toast" id="toast" role="status"></p>
      </section>
    </div>
  </main>
  <script>
    const $ = id => document.getElementById(id);
    let pct = 0, payer = 0;
    let people = (() => { try { return JSON.parse(localStorage.getItem("lunchPeople")) || null; } catch { return null; } })() || ["Me", "Rahul", "Priya"];
    const savePeople = () => { try { localStorage.setItem("lunchPeople", JSON.stringify(people)); } catch {} };
    const money = v => `${$("cur").value} ${v.toLocaleString(undefined, { maximumFractionDigits: 2, minimumFractionDigits: v % 1 ? 2 : 0 })}`;
    const hue = s => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) % 360; return h; };

    [0, 5, 10, 15].forEach(p => {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = p + "%";
      b.onclick = () => { pct = p; calc(); };
      $("tips").appendChild(b);
    });
    $("whatPresets").addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      $("what").value = b.textContent.replace(/^\S+\s/, "");
    });

    function renderPeople() {
      const box = $("people"); box.innerHTML = "";
      people.forEach((n, i) => {
        const chip = document.createElement("span");
        chip.className = "person" + (i === payer ? " payer" : "");
        chip.setAttribute("role", "button"); chip.tabIndex = 0;
        chip.title = "Mark as the one who paid";
        const av = document.createElement("span"); av.className = "av";
        av.style.background = `hsl(${hue(n)} 75% 72%)`; av.textContent = n.slice(0, 1).toUpperCase();
        const nm = document.createElement("span"); nm.textContent = n;
        chip.append(av, nm);
        if (i === payer) { const p = document.createElement("span"); p.className = "paid"; p.textContent = "PAID"; chip.append(p); }
        const pickPayer = () => { payer = i; renderPeople(); calc(); };
        chip.onclick = pickPayer;
        chip.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); pickPayer(); } };
        const x = document.createElement("button");
        x.type = "button"; x.className = "x"; x.textContent = "✕"; x.setAttribute("aria-label", `Remove ${n}`);
        x.onclick = e => {
          e.stopPropagation();
          if (people.length <= 1) return;
          people.splice(i, 1);
          if (payer >= people.length || payer === i) payer = 0; else if (i < payer) payer--;
          savePeople(); renderPeople(); calc();
        };
        chip.append(x); box.append(chip);
      });
      $("headcount").textContent = `${people.length} ${people.length === 1 ? "person" : "people"}`;
    }

    function calc() {
      const bill = Math.max(0, parseFloat($("bill").value) || 0);
      const tip = bill * pct / 100, total = bill + tip, n = people.length, each = total / n;
      $("tip").textContent = money(tip);
      $("total").textContent = money(total);
      $("each").textContent = money(each);
      [...$("tips").children].forEach(b => b.classList.toggle("on", b.textContent === pct + "%"));
      const owes = $("owes"); owes.innerHTML = "";
      people.forEach((p, i) => {
        if (i === payer) return;
        const li = document.createElement("li");
        const a = document.createElement("span"); a.textContent = p;
        const ar = document.createElement("span"); ar.className = "arrow"; ar.textContent = "→";
        const c = document.createElement("span"); c.textContent = people[payer];
        const b = document.createElement("b"); b.textContent = money(each);
        li.append(a, ar, c, b); owes.append(li);
      });
      if (n === 1) owes.innerHTML = "<li>Just you. Treat yourself 😄</li>";
    }

    function shareText() {
      const bill = Math.max(0, parseFloat($("bill").value) || 0), total = bill * (1 + pct / 100), each = total / people.length;
      const what = $("what").value.trim() || "Team lunch";
      const lines = people.filter((_, i) => i !== payer).map(p => `• ${p}: ${money(each)}`);
      return `🍱 ${what}\nTotal: ${money(total)}${pct ? ` (incl. ${pct}% tip)` : ""}\nEach: ${money(each)}\nPlease pay ${people[payer]}:\n${lines.join("\n")}`;
    }

    $("addForm").onsubmit = e => {
      e.preventDefault();
      const n = $("name").value.trim();
      if (!n || people.length >= 30) return;
      people.push(n); $("name").value = "";
      savePeople(); renderPeople(); calc();
    };
    $("bill").oninput = calc;
    $("cur").onchange = calc;
    $("share").onclick = async () => {
      const text = shareText();
      try {
        if (navigator.share) { await navigator.share({ text }); return; }
        await navigator.clipboard.writeText(text);
        $("toast").textContent = "Copied! Paste it in the team group.";
      } catch { $("toast").textContent = "Couldn't share. Long-press to copy the amounts above."; }
      setTimeout(() => $("toast").textContent = "", 3000);
    };
    renderPeople(); calc();
  </script>
</body>
</html>
