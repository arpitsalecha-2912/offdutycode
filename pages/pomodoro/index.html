<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pomodoro Timer</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #0a0b12; --fg: #eef0f7; --muted: #9097ab; --work: #ff7a6b; --rest: #7cd992; --ring: rgba(255,255,255,0.08); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(circle at 50% 0%, #2a1420 0%, var(--bg) 60%); color: var(--fg);
      font-family: "Space Grotesk", system-ui, sans-serif; text-align: center;
    }
    body.rest { background: radial-gradient(circle at 50% 0%, #10261a 0%, var(--bg) 60%); }
    h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
    .dial { position: relative; width: min(78vw, 300px); aspect-ratio: 1; margin: 28px auto; }
    svg { width: 100%; height: 100%; transform: rotate(-90deg); }
    circle { fill: none; stroke-width: 10; }
    .track { stroke: var(--ring); }
    .prog { stroke: var(--work); stroke-linecap: round; transition: stroke-dashoffset .5s linear, stroke .3s; }
    body.rest .prog { stroke: var(--rest); }
    .time { position: absolute; inset: 0; display: grid; place-content: center; font-family: "JetBrains Mono", monospace; }
    .time b { font-size: clamp(2.6rem, 12vw, 3.6rem); }
    .time span { color: var(--muted); font-size: 0.9rem; }
    .btns { display: flex; gap: 12px; justify-content: center; }
    button {
      font: 600 1rem "Space Grotesk", sans-serif; padding: 14px 26px; border-radius: 14px; cursor: pointer;
      border: 1px solid var(--ring); background: rgba(255,255,255,0.05); color: var(--fg);
    }
    button.main { background: var(--work); border-color: var(--work); color: #2a0b06; min-width: 130px; }
    body.rest button.main { background: var(--rest); border-color: var(--rest); color: #06210f; }
    .count { margin-top: 22px; color: var(--muted); font-size: 0.9rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="mode">Focus</h1>
    <div class="dial">
      <svg viewBox="0 0 120 120"><circle class="track" cx="60" cy="60" r="52"/><circle class="prog" id="prog" cx="60" cy="60" r="52"/></svg>
      <div class="time"><b id="time">25:00</b><span id="hint">ready when you are</span></div>
    </div>
    <div class="btns">
      <button class="main" id="start">Start</button>
      <button id="reset">Reset</button>
    </div>
    <p class="count" id="count">🍅 0 sessions done</p>
  </main>
  <script>
    const LEN = { focus: 25 * 60, rest: 5 * 60 };
    const C = 2 * Math.PI * 52;
    const prog = document.getElementById("prog");
    prog.style.strokeDasharray = C;
    let mode = "focus", left = LEN.focus, timer = null, done = 0;

    function draw() {
      const m = String(Math.floor(left / 60)).padStart(2, "0"), s = String(left % 60).padStart(2, "0");
      document.getElementById("time").textContent = `${m}:${s}`;
      document.title = `${m}:${s} · ${mode === "focus" ? "Focus" : "Break"}`;
      prog.style.strokeDashoffset = C * (1 - left / LEN[mode]);
      document.getElementById("mode").textContent = mode === "focus" ? "Focus" : "Break";
      document.body.classList.toggle("rest", mode === "rest");
    }
    function tick() {
      if (--left > 0) return draw();
      if (mode === "focus") done++;
      mode = mode === "focus" ? "rest" : "focus";
      left = LEN[mode];
      document.getElementById("count").textContent = `🍅 ${done} session${done === 1 ? "" : "s"} done`;
      document.getElementById("hint").textContent = mode === "focus" ? "back to it" : "stretch, sip water";
      draw();
    }
    document.getElementById("start").onclick = e => {
      if (timer) { clearInterval(timer); timer = null; e.target.textContent = "Start"; document.getElementById("hint").textContent = "paused"; }
      else { timer = setInterval(tick, 1000); e.target.textContent = "Pause"; document.getElementById("hint").textContent = mode === "focus" ? "deep work" : "relax"; }
    };
    document.getElementById("reset").onclick = () => {
      clearInterval(timer); timer = null; mode = "focus"; left = LEN.focus;
      document.getElementById("start").textContent = "Start";
      document.getElementById("hint").textContent = "ready when you are";
      draw();
    };
    draw();
  </script>
</body>
</html>
