<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My New Page</title>
  <!-- Shared look: dark/light theme + cards, buttons, inputs -->
  <script src="../_shared/theme.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../_shared/ui.css">
  <style>
    .grid { display: grid; gap: 16px; }
    @media (min-width: 900px) { .grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-head">
      <div>
        <p class="eyebrow">Category · tagline</p>
        <h1 class="title">✨ My New Page</h1>
        <p class="lead">One line about what this page does.</p>
      </div>
    </header>
    <div class="grid">
      <section class="card">
        <div class="card-title">Left card</div>
        <label><span class="label">An input</span><input class="input" placeholder="Type here"></label>
      </section>
      <section class="card">
        <div class="card-title">Right card</div>
        <button class="btn primary">A button</button>
      </section>
    </div>
  </main>
</body>
</html>
